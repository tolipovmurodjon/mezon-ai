[project]
name = "mezon"
version = "0.0.0"
description = "Mezon: legality checker for local government (hokim) decisions"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "playwright>=1.65.2",
    "truststore>=0.10.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
