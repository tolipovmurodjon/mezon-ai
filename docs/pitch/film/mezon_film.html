       Instrument Serif italic (only for HUMAN lines: signed, by hand, who sees, expert, a person decides).

<script>
'use strict';
/* =============================================================================================
   TIME GRID (measured from music.mp3)
   ============================================================================================= */
const BEAT = 60 / 148, BAR = 4 * BEAT, T0 = 0.296;
const bar = n => T0 + n * BAR;            // downbeat of bar n
const bt = (n, k = 0) => bar(n) + k * BEAT; // beat k (0-3, may be fractional) of bar n
const END = 56.27;

/* Named musical cues, for reading the timeline */
const CUES = {
  claps: bar(0), build1: bar(2), firstDownbeat: bar(3), breakStart: bar(8), breakStill: bar(9),
  build2: bar(10), DROP: bar(11), dip: bar(16), build3: bar(19), high: bar(20), tail: bar(32), silence: bar(33)
};

/* =============================================================================================
   SCENES: one row per scene. from/to are hard cuts on beats. fx = drawing code below.
   ============================================================================================= */
const SCENES = [
  { id: 'hook',    from: 0,         to: bt(4),     music: 'claps; build bar 2; strike on first full downbeat (bar 3)', idea: 'typed citation, ember strike' },
  { id: 'dead',    from: bt(4),     to: bt(5),     music: 'full beat',            idea: 'mask rise, one line per beat' },
  { id: 'signed',  from: bt(5),     to: bt(6),     music: 'full beat',            idea: 'tracking collapse + signature stamp' },
  { id: 'flood',   from: bt(6),     to: bt(7),     music: 'full beat',            idea: '907 624: digit flood accordions into the figure' },
  { id: 'days',    from: bt(7),     to: bt(8),     music: 'full beat',            idea: 'workload: 2-5 ish kuni per draft, day bars tick per beat' },
  { id: 'court',   from: bt(8),     to: bt(9),     music: 'BREAK begins',         idea: '611 bigger than the screen, near still' },
  { id: 'who',     from: bt(9),     to: bt(10),    music: 'BREAK stillness',      idea: 'serif question, nothing moves' },
  { id: 'drop',    from: bt(10),    to: bt(12),    music: 'build -> DROP 18.13',  idea: 'line up -> particles -> MEZON on the drop' },
  { id: 'sources', from: bt(12),    to: bt(13),    music: 'peak',                 idea: 'three sources slam per beat, teal scan' },
  { id: 'clock',   from: bt(13),    to: bt(14),    music: 'peak',                 idea: 'slot-reel clock 00:00 -> 23:59' },
  { id: 'timeline', from: bt(14),   to: bt(16),    music: 'peak',                 idea: 'law-version strip breaks at 19.10.2024; decisions drop on their dates' },
  { id: 'agent',   from: bt(16),    to: bt(20),    music: 'dip; build at bar 19', idea: 'typed question, steps one at a time' },
  { id: 'compare', from: bt(20),    to: bt(22),    music: 'high',                 idea: 'side-by-side quotes, shared highlight' },
  { id: 'verdict', from: bt(22),    to: bt(24),    music: 'high',                 idea: "Adliya's own verdict: slot-select, fix line, expert stamp" },
  { id: 'queue',   from: bt(24),    to: bt(26),    music: 'high',                 idea: 'list re-sorts one move per beat, reason tag per climb' },
  { id: 'report',  from: bt(26),    to: bt(27),    music: 'high',                 idea: 'the list flies into one page' },
  { id: 'lexai',   from: bt(27),    to: bt(28),    music: 'high',                 idea: 'LexAI javob beradi. / Mezon tekshiradi.' },
  { id: 'quotes',  from: bt(28),    to: bt(29),    music: 'high',                 idea: '354/354 halves slam together' },
  { id: 'grid',    from: bt(29),    to: bt(30, 2), music: 'high',                 idea: '20 real numbers, ten flip teal per eighth note -> 10/20' },
  { id: 'cases',   from: bt(30, 2), to: bt(32),    music: 'high; bar 31 downbeat', idea: 'AYNAN NUSXA locks; ORQAGA KUCH types backwards onto bar 31' },
  { id: 'end',     from: bt(32),    to: 1e9,       music: 'quiet tail; silence 53.82', idea: 'lines -> particles -> MEZON in silence' },
];

/* Use-case kicker (persistent top-left label) */
const KICKERS = [
  { from: bt(3),  to: bt(6),  n: '',   label: 'BITTA QAROR',  color: 'var(--ink)' },   // chapter A: this one decision
  { from: bt(6),  to: bt(9),  n: '',   label: 'BUTUN TIZIM',  color: 'var(--ink)' },   // hard break: chapter B, the system
  { from: bt(12), to: bt(16), n: '01', label: 'KUZATUV',     color: 'var(--teal)' },
  { from: bt(16), to: bt(20), n: '02', label: 'AGENT',       color: 'var(--violet)' },
  { from: bt(20), to: bt(24), n: '03', label: 'EKSPERT',     color: 'var(--ink)' },
  { from: bt(24), to: bt(27), n: '04', label: 'ADLIYA UCHUN', color: 'var(--ember)' },
  { from: bt(28), to: bt(32), n: '05', label: 'ISBOT',       color: 'var(--teal)' },
];

/* =============================================================================================
   EASING + HELPERS
   ============================================================================================= */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const P = (t, a, d) => d <= 0 ? (t >= a ? 1 : 0) : clamp((t - a) / d);
const E = {
  cubicOut: u => 1 - Math.pow(1 - u, 3),
  cubicIn: u => u * u * u,
  cubicInOut: u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2,
  expoOut: u => u >= 1 ? 1 : 1 - Math.pow(2, -10 * u),
  expoIn: u => u <= 0 ? 0 : Math.pow(2, 10 * u - 10),
  expoInOut: u => u <= 0 ? 0 : u >= 1 ? 1 : u < .5 ? Math.pow(2, 20 * u - 10) / 2 : (2 - Math.pow(2, -20 * u + 10)) / 2,
  backOut: (u, s = 1.70158) => 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2),
};
const spring = (dt, amp, f = 20, d = 8) => dt < 0 ? 0 : amp * Math.exp(-d * dt) * Math.cos(f * dt);
const shake = (dt, amp, f = 55, d = 11) => dt < 0 ? 0 : amp * Math.exp(-d * dt) * Math.sin(f * dt);
const rnd = i => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };

const stage = document.getElementById('stage');
const cv = document.getElementById('fx');
const ctx = cv.getContext('2d');
let K = 1; // canvas resolution factor

function mk(parent, cls, text = '', o = {}) {
  const e = document.createElement(o.tag || 'div');
  e.className = cls;
  if (text) e.textContent = text;
  if (o.left !== undefined) e.style.left = o.left + 'px';
  if (o.top !== undefined) e.style.top = o.top + 'px';
  if (o.size) e.style.fontSize = o.size + 'px';
  if (o.width) e.style.width = o.width + 'px';
  if (o.color) e.style.color = o.color;
  if (o.align) e.style.textAlign = o.align;
  parent.appendChild(e);
  return e;
}
function chars(el) {
  const t = el.textContent; el.textContent = '';
  return [...t].map(c => { const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; el.appendChild(s); return s; });
}
// masked line: text rises from behind its own baseline
function mline(parent, text, cls, x, y, size) {
  const w = mk(parent, 'mask', '', { left: x, top: y - 0.12 * size });
  w.style.fontSize = size + 'px'; w.style.padding = '0.12em 0.04em 0.2em 0';
  const i = mk(w, 'L ' + cls, text); i.style.fontSize = size + 'px';
  return { w, i };
}
function tf(el, x = 0, y = 0, sx = 1, sy = sx, r = 0) {
  el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${sx},${sy})`;
}
const op = (el, v) => { el.style.opacity = v; };
const clipR = (el, u) => { el.style.clipPath = `inset(-20% ${(1 - u) * 100}% -20% -2%)`; }; // reveal left -> right
const SVGNS = 'http://www.w3.org/2000/svg';
function svg(parent, w, h, inner, cls = 'g') {
  const s = document.createElementNS(SVGNS, 'svg');
  s.setAttribute('class', cls); s.setAttribute('viewBox', `0 0 ${w} ${h}`); s.innerHTML = inner;
  parent.appendChild(s); return s;
}
// drawn glyphs (the fonts have no arrow / not-equal glyphs)
const ARROW = '<path d="M2 20H94M74 4 96 20 74 36" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="square" pathLength="1"/>';
const NEQ_BOLD = '<path d="M2 21H58M2 41H58M45 2 15 58" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="square"/>';
const NEQ = '<path d="M4 20H56M4 40H56M42 4 18 56" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="square"/>';

/* reels (slot-roll digits) */
function reel(parent, seq) {
  const r = document.createElement('span'); r.className = 'reel';
  const s = document.createElement('span'); s.className = 'strip';
  seq.forEach(d => { const c = document.createElement('div'); c.textContent = d; s.appendChild(c); });
  r.appendChild(s); parent.appendChild(r); r._s = s; return r;
}
function setReel(r, idx, stretch = 1) {
  r._s.style.transform = `translateY(${-idx * 1.1}em)`;
  r.style.transform = stretch !== 1 ? `scaleY(${stretch})` : '';
}

/* canvas text layout + glyph drawing */
const FONT = {
  monoC: w => `condensed ${w} 100px "Martian Mono"`,
  mono: w => `${w} 100px "Martian Mono"`,
  serif: 'italic 400 100px "Instrument Serif"',
};
const meas = document.createElement('canvas').getContext('2d');
function layoutLine(text, f100, size, x, yMid, align = 'left') {
  meas.font = f100;
  const W = i => meas.measureText(text.slice(0, i)).width * size / 100;
  const total = W(text.length);
  const x0 = align === 'center' ? x - total / 2 : x;
  const out = [];
  [...text].forEach((ch, i) => { if (ch !== ' ') out.push({ ch, x: x0 + (W(i) + W(i + 1)) / 2, y: yMid, size, f: f100 }); });
  return out;
}
let curFont = '';
function glyph(ch, x, y, size, f, color, alpha = 1, ang = 0, st = 1) {
  if (f !== curFont) { ctx.font = f; curFont = f; }
  const sc = size / 100, c = Math.cos(ang), s = Math.sin(ang), q = 1 / Math.pow(st, 0.25);
  const a00 = (c * c * st + s * s * q) * sc, a01 = (c * s * (st - q)) * sc, a11 = (s * s * st + c * c * q) * sc;
  ctx.setTransform(K * a00, K * a01, K * a01, K * a11, K * x, K * y);
  ctx.globalAlpha = alpha; ctx.fillStyle = color;
  ctx.fillText(ch, 0, 0);
}
function sampleWord(word, font, cx, cy, step) {
  const c = document.createElement('canvas'); c.width = 1920; c.height = 1080;
  const g = c.getContext('2d'); g.font = font; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  const m = g.measureText(word);
  const by = cy + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
  g.fillText(word, cx, by);
  const d = g.getImageData(0, 0, 1920, 1080).data, pts = [];
  for (let y = 0; y < 1080; y += step) for (let x = (y / step) % 2 ? step / 2 : 0; x < 1920; x += step)
    if (d[(y * 1920 + (x | 0)) * 4 + 3] > 140) pts.push({ x, y });
  return { pts, by };
}
const COL = { ink: '#121210', mute: '#a3a095', ember: '#e0461a', teal: '#08876f', violet: '#5b3cf0' };

/* MEZON word (shared by the drop and the end) */
const WORD = { text: 'MEZON', font: '800 330px "Martian Mono"', cx: 960, cy: 450 };
function drawWord(t, scale = 1, alpha = 1, color = COL.ink) {
  ctx.setTransform(K * scale, 0, 0, K * scale, K * WORD.cx * (1 - scale), K * WORD.cy * (1 - scale));
  ctx.font = WORD.font; curFont = WORD.font; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.globalAlpha = alpha; ctx.fillStyle = color;
  ctx.fillText(WORD.text, WORD.cx, WORD.by);
  ctx.textBaseline = 'middle';
}

/* particle morph: source characters -> word outline */
function makeMorph(src, tBreak, tArrive, opt = {}) {
  const S = sampleWord(WORD.text, WORD.font, WORD.cx, WORD.cy, opt.step || 9);
  WORD.by = S.by;
  // ordered mapping: sources sorted left->right feed matching vertical slices of the word,
  // so the burst reads as the lines stretching into the word, not as noise
  const tg = S.pts.map((p, i) => ({ ...p, k: p.x + (rnd(i * 3.7 + 1) - 0.5) * 90 })).sort((a, b) => a.k - b.k);
  const order = src.map((s, j) => j).sort((a, b) => src[a].x - src[b].x);
  const parts = tg.map((p, i) => {
    const j = order[Math.min(src.length - 1, Math.floor(i / tg.length * src.length))]; const s = src[j];
    const d = (opt.stagger ?? 0.22) * clamp(s.x / 1920) + rnd(i + 11) * 0.08;
    const dx = p.x - s.x, dy = p.y - s.y, L = Math.hypot(dx, dy) || 1;
    return { s, tx: p.x, ty: p.y, d, dur: Math.max(0.12, tArrive - tBreak - d), nx: -dy / L, ny: dx / L, ux: dx / L, uy: dy / L,
      arc: (rnd(i + 5) - 0.5) * (opt.arc ?? 260), spark: rnd(i + 999) < 0.055 };
  });
  parts.sort((a, b) => (a.s.f < b.s.f ? -1 : a.s.f > b.s.f ? 1 : 0));
  return { src, parts, tBreak, tArrive, tgtSize: opt.tgtSize || 15, stagger: opt.stagger ?? 0.22 };
}
function pathAt(p, u) {
  const e = E.expoInOut(u);
  const ant = u < 0.3 ? Math.sin(Math.PI * u / 0.3) * 22 : 0;            // anticipation: pull back first
  const a = p.arc * Math.sin(Math.PI * e);
  return [lerp(p.s.x, p.tx, e) + p.nx * a - p.ux * ant, lerp(p.s.y, p.ty, e) + p.ny * a - p.uy * ant];
}
function drawMorph(M, t, srcDraw) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (t < M.tBreak) { srcDraw(t); return; }
  // the lined-up text sheds its particles: each source glyph fades as its swarm leaves (left to right)
  for (const s of M.src) {
    const a = 1 - E.cubicIn(P(t, M.tBreak + M.stagger * clamp(s.x / 1920), 0.3));
    if (a > 0) glyph(s.ch, s.x, s.y, s.size, s.f, s.color, a);
  }
  for (const p of M.parts) {
    const u = P(t, M.tBreak + p.d, p.dur);
    if (u <= 0) continue;
    const [x, y] = pathAt(p, u);
    const [x2, y2] = pathAt(p, Math.min(1, u + 0.03));
    const v = Math.hypot(x2 - x, y2 - y);
    const st = 1 + Math.min(0.8, v / 36);
    const size = lerp(p.s.size * 0.4, M.tgtSize, E.expoOut(Math.min(1, u * 1.6))) * (1 - 0.4 * Math.sin(Math.PI * u)); // smaller in flight: a swarm, not a blob
    const color = u > 0.5 ? COL.ink : p.s.color;
    glyph(p.s.ch, x, y, size, p.s.f, color, Math.min(1, u * 7), Math.atan2(y2 - y, x2 - x), st);
  }
}
function drawSparks(M, t, tSnap) {
  const dt = t - tSnap; if (dt < 0 || dt > 0.55) return;
  const a = 1 - E.cubicOut(dt / 0.55);
  for (const p of M.parts) {
    if (!p.spark) continue;
    const dx = p.tx - WORD.cx, dy = p.ty - WORD.cy, L = Math.hypot(dx, dy) || 1;
    const dist = 460 * E.expoOut(dt / 0.55) * (0.6 + rnd(p.tx + p.ty) * 0.8);
    glyph(p.s.ch, p.tx + dx / L * dist, p.ty + dy / L * dist * 0.8, 18, p.s.f, COL.teal, a * 0.9, Math.atan2(dy, dx), 1 + 1.6 * a);
  }
}

FX.hook = {
  build(r) {
    const s = {};
    const L = [{ t: '...Qonunining', y: 250 }, { t: '6 va 25-moddalariga', y: 410 }, { t: 'asosan', y: 570 }];
    s.lines = L.map(l => { const e = mk(r, 'L mono', l.t, { left: 160, top: l.y, size: 140 }); return { e, c: chars(e) }; });
    // typing schedule: [line, fromChar, toChar, start, secondsPerChar]
    const W = [[0, 0, 3, bt(0, 0), 0.06], [0, 3, 13, bt(0, 1), 0.09], [1, 0, 1, bt(1, 0), 0], [1, 2, 4, bt(1, 1), 0.07],

    s.times = s.lines.map(l => l.c.map(() => 99));
    s.order = [];
    W.forEach(([li, a, b, st, r]) => { for (let i = a; i < b; i++) { s.times[li][i] = st + (i - a) * r; s.order.push([li, i]); } });
    s.times[1][1] = s.times[1][0]; s.times[1][4] = s.times[1][3];
    s.lastType = Math.max(...s.order.map(([l, i]) => s.times[l][i]));
    s.caret = mk(r, 'block'); s.caret.style.width = '10px'; s.caret.style.height = '108px';
    s.cap = mk(r, 'L cap', "Yakkabog' tumani hokimi  ·  355-4-68-Q/25  ·  13.11.2025", { left: 160, top: 786, size: 44 });
    s.cap.style.color = 'var(--ink)'; s.cap.style.fontWeight = 500;
    s.strike = mk(r, 'block'); s.strike.style.background = 'var(--ember)'; s.strike.style.height = '18px';
    return s;
  },
  draw(t, s) {
    const tS = bt(3, 0);
    const dim = E.cubicInOut(P(t, bt(2, 3), 0.35));
    const fall = E.cubicOut(P(t, bt(3, 2), 0.7));
    s.lines.forEach((l, li) => {
      const isTarget = i => li === 1 && i >= 5;
      if (li === 1) tf(l.e, shake(t - tS, 18), 0);
      l.c.forEach((c, i) => {
        const ta = s.times[li][i];
        if (t < ta) { op(c, 0); return; }
        let y = -0.12 * 140 * (1 - E.expoOut(P(t, ta, 0.14)));
        let sc = 1;
        if (li === 1 && i === 0) sc = lerp(1.9, 1, E.backOut(P(t, ta, 0.3), 2.4)); // "6" slams on bar 1
        if (isTarget(i)) {
          c.style.color = t >= tS ? 'var(--ember)' : '';
          const crouch = t < tS ? 1 - 0.07 * E.cubicIn(P(t, tS - 0.22, 0.22)) : 1 + spring(t - tS, 0.06, 26, 10);
          c.style.transformOrigin = '50% 80%';
          tf(c, 0, y, sc, crouch); op(c, 1);
        } else {
          tf(c, 0, y + fall * 18, sc); op(c, 1 - 0.7 * dim - 0.12 * fall);
        }
      });
    });
    // caret: after the last typed character, blinks on the beat when idle
    let last = null;
    for (const [li, i] of s.order) if (t >= s.times[li][i]) last = [li, i];
    const idle = last === null || t > s.lastType + 0.15;
    const blink = ((t - T0 + 10 * BEAT) / BEAT) % 1 < 0.55;
    const showCaret = t < bt(2, 2) && (!idle || blink);
    if (last === null) { s.caret.style.left = '160px'; s.caret.style.top = (250 + 16) + 'px'; }
    else {
      const [li, i] = last, c = s.lines[li].c[i];
      s.caret.style.left = (160 + c.offsetLeft + c.offsetWidth + 6) + 'px';
      s.caret.style.top = (s.lines[li].e.offsetTop + 16) + 'px';
    }
    op(s.caret, showCaret ? 1 : 0);
    clipR(s.cap, E.cubicOut(P(t, bt(2, 1), 0.45)));
    op(s.cap, 1); // the source stays in ink while the citation dims
    // the strike: on the first full downbeat
    const a = s.lines[1].c[5], b = s.lines[1].c[18];
    const w = b.offsetLeft + b.offsetWidth - a.offsetLeft + 16;
    const u = P(t, tS, 0.16);
    s.strike.style.left = (160 + a.offsetLeft - 8 + shake(t - tS, 18)) + 'px';
    s.strike.style.top = (410 + 0.47 * 140) + 'px';
    s.strike.style.width = (w * clamp(E.backOut(u, 1.4), 0, 1.04)) + 'px';
    op(s.strike, t >= tS ? 1 : 0);
  }
};

    s.b = mk(r, 'L mono', '/354', { left: left + 3 * cw, top: 230, size }); s.b.style.fontWeight = 800;
    s.b.innerHTML = '<span class="teal">/</span>354';
    s.sub = mline(r, 'iqtibos aynan', 'mono teal', 0, 650, 120); s.sub.w.style.width = '1920px'; s.sub.i.style.textAlign = 'center';
    s.cap = mk(r, 'L cap', "354 ta iqtibosning 354 tasi lex.uz matnida so'zma-so'z bor", { left: 0, top: 850, size: 38, width: 1920, align: 'center' });
    return s;
  },
  draw(t, s) {
    const t0 = bt(28, 0), tm = bt(28, 1);
    const inn = E.expoOut(P(t, t0, 0.22));              // fly in from the edges, stop apart (tension)
    const gap = lerp(1100, 70, inn);
    const meet = E.expoIn(P(t, tm - 0.1, 0.1));          // snap together on beat 2
    const g = gap * (1 - meet);
    const imp = spring(t - tm, 1, 26, 9);                // impact: compress then settle
    const sx = t >= tm ? 1 - 0.06 * imp : 1 + (1 - inn) * 1.4;
    s.a.style.transformOrigin = '100% 50%'; s.b.style.transformOrigin = '0 50%';
    tf(s.a, -g + (t >= tm ? 8 * imp : 0), 0, sx, 1); tf(s.b, g - (t >= tm ? 8 * imp : 0), 0, sx, 1);
    op(s.a, P(t, t0, 0.05)); op(s.b, P(t, t0, 0.05));
    s.sub.i.style.transform = `translateY(${(1 - E.expoOut(P(t, bt(28, 2), 0.42))) * 140}%)`;
    op(s.cap, E.cubicOut(P(t, bt(28, 3), 0.3)));
  }
};

/* 20 GRID: the 20 cancelled decisions with text (eval/report.md); the 10 Mezon flagged flip teal */
// [registration number, flagged by Mezon before knowing the answer] - printed by the eval stores, 19.11.2026
const EVAL20 = [
  ['VI-39-2-3-49-K/22', 1], ['161-14-207-Q/21', 1], ['VI-40-46-4-56-K/21', 1], ['VI-79-54-12-174-K/22', 1],
  ['102-9-131-Q/21', 1], ['VI-37-67-5-73-K/21', 0], ['II-49-2-14-205-K/22', 0], ['II-49-4-14-205-K/22', 0],
  ['88-11-164-Q/22', 0], ['VI-61-69-4-66-K/22', 1], ['362-2-31-Q/22', 0], ['407-4-57-Q/22', 0],
  ['VI-79-294-2-33-K/22', 0], ['VI-51-202-13-194-K/22', 0], ['222-10-136-Q/23', 1], ['231-4-59-Q/24', 1],
  ['VI-51-66-1-27-K/24', 0], ['109-5-75-Q/24', 1], ['VII-3-016-2-40-K/24', 0], ['VII-3-1-5-77-K/25', 1],
];
FX.grid = {
  build(r) {
    const s = {};
    s.cells = EVAL20.map(([n, f], i) => {
      const c = i % 4, row = Math.floor(i / 4);
      const e = mk(r, 'L mono', n, { left: 160 + c * 408, top: 178 + row * 64, size: 31 }); e.style.fontWeight = 600;
      return { e, f };
    });
    let k = 0; s.cells.forEach(c => { if (c.f) c.tick = bt(29, 0) + 0.06 + (k++) * BEAT / 2; }); // one per eighth note
    s.count = mk(r, 'L mono', '', { left: 0, top: 530, size: 300, width: 1920, align: 'center' }); s.count.style.fontWeight = 800;
    s.num = mk(s.count, 'teal', '0', { tag: 'span' }); mk(s.count, '', '/20', { tag: 'span' });
    s.count.style.transformOrigin = '50% 60%';
    s.cap = mk(r, 'L mono', 'bekor qilingan qaror  ·  javobni bilmasdan belgilandi', { left: 0, top: 910, size: 44, width: 1920, align: 'center' });
    s.cap.style.fontWeight = 500;
    return s;
  },
  draw(t, s) {
    const t0 = bt(29, 0);
    let n = 0, last = -9;
    s.cells.forEach((c, i) => {
      op(c.e, P(t, t0 + (i % 4) * 0.02 + Math.floor(i / 4) * 0.03, 0.12));
      const on = c.f && t >= c.tick;
      if (on) { n++; last = Math.max(last, c.tick); }
      c.e.style.color = on ? 'var(--teal)' : 'var(--mute)';
      tf(c.e, 0, on ? -spring(t - c.tick, 10, 30, 12) : 0);
    });
    s.num.textContent = String(n);
    const full = n === 10;
    tf(s.count, 0, 0, 1 + spring(t - last, full ? 0.1 : 0.04, 26, 10));
    op(s.cap, E.cubicOut(P(t, t0 + 0.2, 0.3)));
  }
};

/* 21 CASES: two real adliya representations; the defect is the headline -------------------- */
FX.cases = {
  build(r) {
    const s = {};
    s.head = mk(r, 'L cap teal', 'ADLIYA TAQDIMNOMASI BILAN MOS  ·  2 TA HOLAT', { left: 160, top: 196, size: 36 });
    // Qarshi: two copies of the words slide together and lock into one = the identical copy
    const mkWord = (txt, top, cls) => { const e = mk(r, 'L mono ' + cls, txt, { left: 160, top, size: 180 }); e.style.fontWeight = 800; return e; };
    s.qa = mkWord('AYNAN NUSXA', 290, 'ember'); s.qb = mkWord('AYNAN NUSXA', 290, 'ember');
    s.la = mk(r, 'L cap', '207-4-59-Q/24 · 06.06.2024', { left: 160, top: 488, size: 32 });
    s.lb = mk(r, 'L cap', '231-4-59-Q/24 · 21.06.2024', { left: 160, top: 488, size: 32 });
    s.qcap = mk(r, 'L', 'Qarshi tumani  ·  231-4-59-Q/24  ·  adliya taqdimnomasi 27-7/1-34', { left: 160, top: 488, size: 34 });
    // Xatirchi: the words type in backwards, last letter first, landing on the bar-31 downbeat
    s.x = mkWord('ORQAGA KUCH', 600, 'ember'); s.xc = chars(s.x);
    s.xcap = mk(r, 'L', 'Xatirchi tumani  ·  VII-3-1-5-77-K/25  ·  adliya taqdimnomasi 6/3-1', { left: 160, top: 826, size: 34 });
    [s.qcap, s.xcap].forEach(e => { e.style.fontFamily = "'Geist Mono',monospace"; e.style.fontWeight = 500; });
    return s;
  },
  draw(t, s) {
    const t0 = bt(30, 2), lock = bt(30, 3), xl = bt(31, 0);
    op(s.head, P(t, t0, 0.12));
    const u = P(t, t0, lock - t0), e = E.expoInOut(u);
    const gap = (1 - e) * 760;
    const imp = t >= lock ? spring(t - lock, 1, 30, 10) : 0;
    tf(s.qa, -gap - 10 * imp, 0); tf(s.qb, gap + 10 * imp, 0);
    op(s.qb, P(t, t0, 0.05));
    op(s.qa, t < t0 ? 0 : (t >= lock ? 0 : 0.35));            // the ghost copy disappears into the solid one on the beat
    tf(s.la, -gap, 0); tf(s.lb, gap, 0);
    const lab = t < lock ? P(t, t0, 0.1) : 1 - P(t, lock, 0.12);
    op(s.la, lab); op(s.lb, lab);
    clipR(s.qcap, E.expoOut(P(t, lock + 0.05, 0.35)));
    s.xc.forEach((c, i) => {
      const a = xl - 0.1 - i * 0.035;                       // i = 0 (first letter) lands last, on the downbeat
      const v = P(t, a, 0.2);
      tf(c, (1 - E.backOut(v, 1.5)) * -90, 0); op(c, P(t, a, 0.05));
    });
    clipR(s.xcap, E.expoOut(P(t, bt(31, 0.5), 0.35)));
  }
};

/* 22 END: lines -> particles -> MEZON, into silence ------------------------------------------- */
FX.end = {
  build(r) {
    const s = {};
    s.brand = mk(r, 'L mono teal', 'mahalliy qarorlar auditori  ·  Adliya uchun', { left: 0, top: 650, size: 54, width: 1920, align: 'center' });
    s.brand.style.fontWeight = 600;
    s.tag = mk(r, 'L mono', '', { left: 0, top: 760, size: 60, width: 1920, align: 'center' }); s.tag.style.fontWeight = 500;
    mk(s.tag, '', 'Belgilangan ', { tag: 'span' });
    const g = svg(s.tag, 60, 60, NEQ_BOLD); g.style.cssText = 'width:0.7em;height:0.7em;vertical-align:-0.08em;color:var(--ember)';
    mk(s.tag, '', ' noqonuniy', { tag: 'span' });
    return s;
  },
  draw(t, s) {
    const tB = bt(32, 3), tF = bar(33);
    if (!s.M) {
      const a = layoutLine('AI taklif qiladi.', FONT.monoC(600), 140, 960, 390, 'center').map(g => ({ ...g, color: COL.violet, at: bt(32, 0), line: 0 }));
      const b = layoutLine('Inson hal qiladi.', FONT.serif, 190, 960, 610, 'center').map(g => ({ ...g, color: COL.ink, at: bt(32, 0.5), line: 1 }));
      a.forEach((g, i) => g.at += i * 0.014); b.forEach((g, i) => g.at += i * 0.014);
      s.M = makeMorph(a.concat(b), tB, tF - 0.02, { tgtSize: 21, step: 12, arc: 100, stagger: 0.12 });
    }
    if (t < tF) {
      drawMorph(s.M, t, tt => {
        for (const g of s.M.src) {
          const u = P(tt, g.at, 0.32); if (u <= 0) continue;
          const y = g.line === 0 ? 0 : (1 - E.cubicOut(u)) * 50;
          glyph(g.ch, g.x, g.y + y, g.size, g.f, g.color, g.line === 0 ? 1 : E.cubicOut(u));
        }
      });
    } else {
      drawWord(t, 1 + spring(t - tF, 0.03, 16, 8));
    }
    const ub = E.cubicOut(P(t, bt(33, 0.5), 0.45)); op(s.brand, ub); tf(s.brand, 0, (1 - ub) * 20);
    const u = E.cubicOut(P(t, bt(33, 1.5), 0.5)); op(s.tag, u); tf(s.tag, 0, (1 - u) * 24);
  }
};

/* =============================================================================================
   KICKER + RENDER
   ============================================================================================= */
const kick = document.getElementById('kicker'); let kickNow = null;
function drawKicker(t) {
  const k = KICKERS.find(k => t >= k.from && t < k.to);
  if (k !== kickNow) { kickNow = k; kick.innerHTML = k ? (k.n ? `<b style="color:${k.color}">${k.n}</b>   ${k.label}` : `<span style="color:var(--mute)">${k.label}</span>`) : ''; }
  if (k) { const u = E.expoOut(P(t, k.from, 0.35)); clipR(kick, u); op(kick, 1); }
}

let FONTS_OK = false;
SCENES.forEach(sc => { sc.root = mk(stage, 'scene'); sc.state = FX[sc.id].build(sc.root); sc._on = false; });

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.clearRect(0, 0, cv.width, cv.height); curFont = '';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const sc of SCENES) {
    const on = t >= sc.from && t < sc.to;
    if (on !== sc._on) { sc.root.style.display = on ? 'block' : 'none'; sc._on = on; }
    if (on && (FONTS_OK || !['flood', 'court', 'drop', 'end'].includes(sc.id))) FX[sc.id].draw(t, sc.state);
  }
  drawKicker(t);
}

/* =============================================================================================
   STAGE, CLOCK, CONTROLS
   ============================================================================================= */
const Q = new URLSearchParams(location.search);
const FROZEN = Q.has('t') ? parseFloat(Q.get('t')) || 0 : null;
let CLEAN = Q.has('clean');
const audio = document.getElementById('music');

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  K = Math.min(2, Math.max(1, s * (devicePixelRatio || 1)));
  cv.width = Math.round(1920 * K); cv.height = Math.round(1080 * K);
}
addEventListener('resize', fit); fit();

let lastCT = -1, lastPerf = 0;
function now() {
  if (FROZEN !== null) return FROZEN;
  const ct = audio.currentTime, p = performance.now();
  if (audio.paused) { lastCT = ct; lastPerf = p; return ct; }
  if (ct !== lastCT) { lastCT = ct; lastPerf = p; }
  return ct + Math.min(0.1, (p - lastPerf) / 1000);
}
function loop() { render(now()); requestAnimationFrame(loop); }

Promise.all([
  document.fonts.load('condensed 800 100px "Martian Mono"', '0123456789MEZON'),
  document.fonts.load('800 100px "Martian Mono"', 'MEZON'),
  document.fonts.load('condensed 600 100px "Martian Mono"', 'AI taklif'),
  document.fonts.load('italic 400 100px "Instrument Serif"', 'Inson'),
  document.fonts.load('400 30px "Geist Mono"', 'abc'),
]).then(() => document.fonts.ready).then(() => { FONTS_OK = true; render(now()); });
requestAnimationFrame(loop);

const ui = document.getElementById('ui'), startBtn = document.getElementById('start'), toast = document.getElementById('toast');
function say(msg) { toast.textContent = msg; toast.style.display = 'block'; clearTimeout(say.h); say.h = setTimeout(() => toast.style.display = 'none', 3500); }
if (FROZEN !== null) startBtn.style.display = 'none';
function play() { audio.play().then(() => { startBtn.style.display = 'none'; }).catch(e => say('Audio ochilmadi: ' + e.message)); }
startBtn.onclick = play;
document.getElementById('bPlay').onclick = () => { if (audio.paused) play(); else audio.pause(); };
audio.onplay = () => document.getElementById('bPlay').textContent = 'pauza';
audio.onpause = () => document.getElementById('bPlay').textContent = 'ijro';
document.getElementById('bRe').onclick = () => { audio.currentTime = 0; play(); };
document.getElementById('bFs').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => say("To'liq ekran ochilmadi")); };
const toggleClean = () => { CLEAN = !CLEAN; ui.classList.remove('show'); if (!CLEAN) say('Boshqaruv: sichqonchani qimirlating'); };
document.getElementById('bClean').onclick = toggleClean;
let hideT;
addEventListener('mousemove', () => {
  if (CLEAN || FROZEN !== null) return;
  ui.classList.add('show'); clearTimeout(hideT); hideT = setTimeout(() => ui.classList.remove('show'), 2000);
});
addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H') toggleClean();
  else if (e.key === ' ') { e.preventDefault(); if (audio.paused) play(); else audio.pause(); }
  else if (e.key === 'f' || e.key === 'F') document.getElementById('bFs').click();
});

/* optional WebM recording of this tab (getDisplayMedia + MediaRecorder) */
document.getElementById('bRec').onclick = async () => {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia || !window.MediaRecorder) throw new Error('bu brauzer yozishni qo\'llamaydi');
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 60 }, audio: true, preferCurrentTab: true, selfBrowserSurface: 'include' });
    const types = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    const mime = types.find(m => MediaRecorder.isTypeSupported(m)) || '';
    const rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 12e6 } : {});
    const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(tr => tr.stop());
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      a.download = 'mezon_film.webm'; a.click(); say('Yozuv saqlandi: mezon_film.webm');
    };
    CLEAN = true; ui.classList.remove('show');
    audio.currentTime = 0; rec.start(); play();
    audio.onended = () => { setTimeout(() => rec.state !== 'inactive' && rec.stop(), 300); };
  } catch (e) { say('Yozib bo\'lmadi: ' + (e && e.message ? e.message : e)); }
};
