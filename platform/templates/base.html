{% load static %}<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mezon{% endblock %} · Mezon</title>
  <meta name="description" content="Mezon: hokimlik qarorlari loyihalarini qonunchilikka muvofiqligini AI yordamida tekshirish.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b0b0b'/%3E%3Cg fill='%23fff'%3E%3Crect x='7' y='7' width='3' height='18' rx='.8'/%3E%3Crect x='22' y='7' width='3' height='18' rx='.8'/%3E%3Crect x='10.5' y='10.5' width='3' height='3' rx='.8'/%3E%3Crect x='18.5' y='10.5' width='3' height='3' rx='.8'/%3E%3Crect x='14.5' y='14.5' width='3' height='3' rx='.8'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'mezon-ui/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'mezon-ui/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script>
    try { var t = localStorage.getItem('mezon-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body class="{% block body_class %}{% endblock %}">
{% include "includes/sprite.html" %}
{% block body %}{% endblock %}
<div class="toast-host" id="toastHost" aria-live="polite"></div>
{% if messages %}<template id="flash">{% for m in messages %}<div data-level="{{ m.level_tag }}" data-sub="{{ m.extra_tags }}">{{ m.message }}</div>{% endfor %}</template>{% endif %}
<script src="{% static 'mezon-ui/kit.js' %}"></script>
<script src="{% static 'js/app.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
